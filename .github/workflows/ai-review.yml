# =============================================================================
# AI-engineering-workspace + petclinic — end-to-end CI/CD pipeline example.
# =============================================================================
#
# Copy this into your petclinic fork at .github/workflows/ai-review.yml, then
# register a self-hosted GitHub Actions runner on a machine that has the
# petclinic build toolchain.
#
# The workflow provisions the AI tool itself — you do NOT pre-clone it and
# there is NO AI_TOOL_PATH variable to set. The "Prepare AI tool" step clones
# (or fast-forwards) the tool into $HOME/ai-engineering-workspace and builds
# its venv. $HOME resolves to whatever user the runner runs as, so the path is
# deterministic without any per-machine configuration.
#
# What this pipeline does:
#   - On pull_request: provision the AI tool, scan + AI review (--strict gate),
#     build petclinic, start it locally, verify health-check, then generate +
#     run external e2e tests. A tripped strict review gate fails the PR check;
#     e2e test failures are posted to the PR as a report but do NOT fail the
#     check (a generated-test bug is not a production regression). Only an
#     infra failure that stops verify from running turns the check red.
#   - On issue_comment containing "/apply": apply the chosen review fixes and
#     commit them to the PR branch.
#   - On push to the default branch (a merged PR): deploy petclinic as a
#     resident local service, then verify it is live and running exactly the
#     merged commit (health + git-version check). The outcome is posted back
#     to the merged PR.
#
# Prerequisites on the self-hosted runner (run it as a normal user account via
# `./run.sh` — not a privileged or `runner`-system context):
#   1. Python 3.12+ and git on PATH
#   2. JDK 17+ and Maven on PATH (to build/run petclinic)
#   3. Network access to github.com and api.anthropic.com
#
# On the petclinic fork itself: the `deploy` job verifies the deployment by
# reading the running service's git commit id from Spring Actuator, so the
# fork must expose it — add to application.properties
#   management.endpoints.web.exposure.include=health,info
#   management.info.git.mode=full
# and add the git-commit-id-maven-plugin to pom.xml. The README "CI/CD
# pipeline" section has the exact snippets.
#
# Repository secrets to set in the petclinic fork (Settings > Secrets and
# variables > Actions):
#   - ANTHROPIC_API_KEY     your Anthropic key
#   - REVIEW_ALLOWED_REPOS  e.g. "your-user/spring-petclinic-reactjs"
# Optional repository variable:
#   - ANTHROPIC_MODEL       claude-sonnet-4-6 (default) or claude-opus-4-7
#
# If your AI tool repo is not jessejia1991/ai-engineering-workspace, edit
# AI_TOOL_REPO in the two "Prepare AI tool" steps below.
# =============================================================================

name: AI Engineering Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  # CD: a push to the default branch is a merged PR. Change `main` here
  # if your fork's default branch is `master`.
  push:
    branches: [main]

# The GITHUB_TOKEN that GitHub Actions injects is read-only by default on
# many repos. This pipeline posts PR comments and pushes /apply fixes, so
# grant exactly those scopes — nothing wider.
permissions:
  contents: write        # ai-apply pushes fixes to the PR branch
  pull-requests: write   # inline review comments + the review verdict
  issues: write          # the Apply Menu (a PR-conversation comment)

env:
  PETCLINIC_REPO_PATH: ${{ github.workspace }}
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
  REVIEW_ALLOWED_REPOS: ${{ secrets.REVIEW_ALLOWED_REPOS }}
  REVIEW_POST_COMMENTS: 'true'
  # VERIFY_TARGET_URL is intentionally NOT set workflow-wide: the CI
  # `review-and-verify` job sets it per-job to port 9967, so its
  # throwaway petclinic never collides with the resident CD deployment
  # on 9966. The `deploy` job targets actuator on 9966 explicitly.

jobs:
  # ---------------------------------------------------------------------------
  # CI job: AI review + build + verify against the locally-deployed petclinic.
  # ---------------------------------------------------------------------------
  review-and-verify:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 25
    # CI runs petclinic on 9967 as a throwaway instance just for the e2e
    # tests. The CD `deploy` job keeps a resident instance on 9966 — the
    # two ports must differ so a CI run never collides with a deployment.
    env:
      VERIFY_TARGET_URL: 'http://localhost:9967/petclinic/api'
    steps:
      - name: Checkout petclinic PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git diff` against base works

      # Clone-or-update the AI tool into a deterministic $HOME-relative path
      # and export AI_TOOL_PATH for the steps below. First run also creates
      # the venv; later runs reuse it. No variable, no pre-clone needed.
      - name: Prepare AI tool
        run: |
          set -e
          AI_TOOL_PATH="$HOME/ai-engineering-workspace"
          AI_TOOL_REPO="https://github.com/jessejia1991/ai-engineering-workspace.git"
          if [ -d "$AI_TOOL_PATH/.git" ]; then
            # Force-sync to origin. The clone is a CI artifact — local
            # runtime writes must never block or diverge from the remote.
            git -C "$AI_TOOL_PATH" fetch --quiet origin
            git -C "$AI_TOOL_PATH" reset --hard --quiet origin/main
          else
            git clone "$AI_TOOL_REPO" "$AI_TOOL_PATH"
          fi
          [ -d "$AI_TOOL_PATH/venv" ] || python3 -m venv "$AI_TOOL_PATH/venv"
          "$AI_TOOL_PATH/venv/bin/pip" install -q -r "$AI_TOOL_PATH/requirements.txt"
          echo "AI_TOOL_PATH=$AI_TOOL_PATH" >> "$GITHUB_ENV"

      - name: AI scan
        working-directory: ${{ env.AI_TOOL_PATH }}
        run: |
          source venv/bin/activate
          python -m cli.main scan

      # CI gate 1 — AI multi-agent review. --strict exits non-zero when a
      # must_have contract criterion is FAIL or any finding is critical.
      # continue-on-error keeps the pipeline going so build + deploy +
      # verify still run and report; the final "Pipeline gate" step turns
      # a failed review into a red check.
      - name: AI review
        id: ai_review
        continue-on-error: true
        working-directory: ${{ env.AI_TOOL_PATH }}
        run: |
          source venv/bin/activate
          python -m cli.main review --pr ${{ github.event.pull_request.number }} --post --strict

      - name: Build petclinic
        run: mvn -B package -DskipTests

      # Start petclinic on the CI port (9967) as a throwaway instance for
      # the e2e tests, wait until its health endpoint responds, then run
      # the tests. The real deployment is the separate `deploy` job below.
      - name: Start petclinic
        run: |
          nohup mvn -B spring-boot:run \
            -Dspring-boot.run.arguments=--server.port=9967 \
            > /tmp/petclinic.log 2>&1 &
          echo "$!" > /tmp/petclinic.pid

      - name: Wait for petclinic ready
        working-directory: ${{ env.AI_TOOL_PATH }}
        run: |
          source venv/bin/activate
          for i in $(seq 1 30); do
            if python -m cli.main verify health-check ; then
              echo "petclinic is up"; exit 0
            fi
            echo "  (attempt $i/30) waiting 5s..."; sleep 5
          done
          echo "petclinic did not become ready in 150s"; tail -100 /tmp/petclinic.log; exit 1

      # External e2e tests — NOT a hard gate. The catalog dedups against
      # already-generated tests, so this only ever costs LLM tokens for
      # APIs touched by the diff that aren't covered yet. `verify run`
      # exits 0 whenever it ran (pass OR fail) and non-zero only when it
      # could not run at all — so continue-on-error + the "Pipeline gate"
      # step below only ever turn red on an infra failure. Test failures
      # are posted to the PR via --post as a standalone verify report.
      - name: AI verify (generate + run)
        id: ai_verify
        continue-on-error: true
        working-directory: ${{ env.AI_TOOL_PATH }}
        run: |
          source venv/bin/activate
          python -m cli.main verify generate --diff --max 3
          python -m cli.main verify run --diff \
            --pr ${{ github.event.pull_request.number }} --post

      - name: Stop petclinic
        if: always()
        run: |
          if [ -f /tmp/petclinic.pid ]; then
            kill "$(cat /tmp/petclinic.pid)" || true
          fi
          # Belt-and-suspenders: kill the Maven wrapper child and free the
          # CI port (9967). The CD resident instance on 9966 is left alone.
          pkill -f 'spring-boot:run' || true
          lsof -ti:9967 | xargs kill -9 2>/dev/null || true

      # The review + verify steps run continue-on-error, so every stage
      # above completes and reports even when a gate trips. This final
      # step is the single place the job goes red — after the whole
      # pipeline has run, not in the middle of it.
      - name: Pipeline gate
        if: always()
        run: |
          echo "AI review : ${{ steps.ai_review.outcome }}"
          echo "AI verify : ${{ steps.ai_verify.outcome }}"
          failed=0
          if [ "${{ steps.ai_review.outcome }}" = "failure" ]; then
            echo "::error::AI review gate failed (strict: must_have FAIL or critical finding)"
            failed=1
          fi
          if [ "${{ steps.ai_verify.outcome }}" = "failure" ]; then
            echo "::error::AI verify could not run (infra failure — e.g. no tests, pytest missing, timeout). NOT a test-failure verdict."
            failed=1
          fi
          exit $failed

  # ---------------------------------------------------------------------------
  # AI-apply job: on PR comments containing "/apply", let the AI commit the
  # chosen review fixes to the PR branch.
  # ---------------------------------------------------------------------------
  ai-apply:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/apply') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # GHA's default checkout fetches the PR head ref via the
          # merge-commit. For `apply` to push back to the branch we need
          # the actual head branch checked out at the head SHA.
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head

      # `refs/pull/N/head` checks out the right SHA but DETACHED — and
      # `apply --push` refuses to push from a detached HEAD. Re-attach to
      # the PR's actual head branch so the push has a real branch to target.
      - name: Attach PR head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.issue.number }} \
                     --json headRefName -q .headRefName)
          git checkout -B "$BRANCH"
          git branch --set-upstream-to="origin/$BRANCH" "$BRANCH" 2>/dev/null || true

      - name: Prepare AI tool
        run: |
          set -e
          AI_TOOL_PATH="$HOME/ai-engineering-workspace"
          AI_TOOL_REPO="https://github.com/jessejia1991/ai-engineering-workspace.git"
          if [ -d "$AI_TOOL_PATH/.git" ]; then
            # Force-sync to origin. The clone is a CI artifact — local
            # runtime writes must never block or diverge from the remote.
            git -C "$AI_TOOL_PATH" fetch --quiet origin
            git -C "$AI_TOOL_PATH" reset --hard --quiet origin/main
          else
            git clone "$AI_TOOL_REPO" "$AI_TOOL_PATH"
          fi
          [ -d "$AI_TOOL_PATH/venv" ] || python3 -m venv "$AI_TOOL_PATH/venv"
          "$AI_TOOL_PATH/venv/bin/pip" install -q -r "$AI_TOOL_PATH/requirements.txt"
          echo "AI_TOOL_PATH=$AI_TOOL_PATH" >> "$GITHUB_ENV"

      - name: AI apply
        working-directory: ${{ env.AI_TOOL_PATH }}
        run: |
          source venv/bin/activate
          python -m cli.main apply \
            --pr ${{ github.event.issue.number }} \
            --comment-id ${{ github.event.comment.id }} \
            --target-path ${{ github.workspace }} \
            --push

  # ---------------------------------------------------------------------------
  # CD job: on a push to the default branch (= a merged PR), deploy petclinic
  # as a resident local service and verify the deployment is live and runs
  # exactly the merged commit. The outcome is posted back to the merged PR.
  # ---------------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 20
    # Never let two deploys race for the deployment port.
    concurrency:
      group: cd-deploy
      cancel-in-progress: false
    # Where this job deploys petclinic — the single source of truth for
    # the deployment address. Every step below derives its port / URL
    # from these. DEPLOY_PORT differs from the CI job's 9967 so the
    # resident deployment and a CI run never collide.
    env:
      DEPLOY_HOST: 'localhost'
      DEPLOY_PORT: '9966'
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare AI tool
        run: |
          set -e
          AI_TOOL_PATH="$HOME/ai-engineering-workspace"
          AI_TOOL_REPO="https://github.com/jessejia1991/ai-engineering-workspace.git"
          if [ -d "$AI_TOOL_PATH/.git" ]; then
            git -C "$AI_TOOL_PATH" fetch --quiet origin
            git -C "$AI_TOOL_PATH" reset --hard --quiet origin/main
          else
            git clone "$AI_TOOL_REPO" "$AI_TOOL_PATH"
          fi
          [ -d "$AI_TOOL_PATH/venv" ] || python3 -m venv "$AI_TOOL_PATH/venv"
          "$AI_TOOL_PATH/venv/bin/pip" install -q -r "$AI_TOOL_PATH/requirements.txt"
          echo "AI_TOOL_PATH=$AI_TOOL_PATH" >> "$GITHUB_ENV"

      - name: Stop previous deployment
        run: |
          # Replace the resident instance left by the last deploy.
          if [ -f "$HOME/.ai-workspace/cd-petclinic.pid" ]; then
            kill "$(cat "$HOME/.ai-workspace/cd-petclinic.pid")" 2>/dev/null || true
          fi
          # Belt-and-suspenders: free the deployment port.
          lsof -ti:"$DEPLOY_PORT" | xargs kill -9 2>/dev/null || true
          sleep 2

      - name: Build petclinic
        run: mvn -B package -DskipTests

      - name: Deploy petclinic (resident)
        run: |
          JAR=$(ls target/*.jar | head -1)
          mkdir -p "$HOME/.ai-workspace"
          # Run the built jar — a real deployment, not the dev-mode
          # `spring-boot:run`. The subshell + nohup detaches the JVM from
          # the job's process tree so it survives as the resident service.
          # macOS has no `setsid`; exiting the subshell reparents the
          # process to launchd, which serves the same purpose.
          ( nohup java -jar "$JAR" --server.port="$DEPLOY_PORT" \
              </dev/null >/tmp/cd-petclinic.log 2>&1 &
            echo $! > "$HOME/.ai-workspace/cd-petclinic.pid" )

      - name: Wait for deployment ready
        working-directory: ${{ env.AI_TOOL_PATH }}
        run: |
          source venv/bin/activate
          for i in $(seq 1 40); do
            if python -m cli.main verify health-check \
                 --url "http://$DEPLOY_HOST:$DEPLOY_PORT/petclinic/actuator/health" ; then
              echo "deployment is up"; exit 0
            fi
            echo "  (attempt $i/40) waiting 5s..."; sleep 5
          done
          echo "deployment did not become ready in 200s"
          tail -100 /tmp/cd-petclinic.log; exit 1

      - name: Resolve the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push event carries no PR number — ask the API which PR this
          # commit was merged from. Empty if the commit had no PR.
          N=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                --jq '.[0].number' 2>/dev/null || true)
          echo "number=${N}" >> "$GITHUB_OUTPUT"
          echo "Merged PR: ${N:-<none>}"

      # The deploy gate. verify deploy-check exits non-zero if the resident
      # service is not UP or is not running ${{ github.sha }} — and either
      # way posts a deploy report to the merged PR. A failed deploy is a
      # real failure, so this step (and the job) goes red.
      - name: Verify deployment
        working-directory: ${{ env.AI_TOOL_PATH }}
        run: |
          source venv/bin/activate
          PR_ARGS=""
          if [ -n "${{ steps.pr.outputs.number }}" ]; then
            PR_ARGS="--pr ${{ steps.pr.outputs.number }} --post"
          fi
          python -m cli.main verify deploy-check \
            --url "http://$DEPLOY_HOST:$DEPLOY_PORT/petclinic/actuator" \
            --expect ${{ github.sha }} $PR_ARGS
